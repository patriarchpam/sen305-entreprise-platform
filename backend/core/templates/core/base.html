{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VUA ServiceDesk{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/css/styles.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container nav-row">
            <a class="brand" href="{% url 'core:home' %}">VUA ServiceDesk</a>
            <nav aria-label="Primary navigation">
                <a href="{% url 'core:home' %}"
                   {% if request.resolver_match.url_name == 'home' %}aria-current="page"{% endif %}>Home</a>
                <a href="{% url 'core:about' %}"
                   {% if request.resolver_match.url_name == 'about' %}aria-current="page"{% endif %}>About</a>
                <a href="{% url 'core:workflow' %}"
                   {% if request.resolver_match.url_name == 'workflow' %}aria-current="page"{% endif %}>Workflow</a>
                <a href="{% url 'core:contact' %}"
                   {% if request.resolver_match.url_name == 'contact' %}aria-current="page"{% endif %}>Contact</a>
            </nav>
        </div>
    </header>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="container">VUA-SEN305 practical project</div>
    </footer>
</body>
</html>
